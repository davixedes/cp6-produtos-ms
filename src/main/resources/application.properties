spring.application.name=produtos-ms

# produtos-ms roda em porta propria para nao conflitar com o vendas-ms (8080)
server.port=8082

# Banco de dados (MySQL via Docker Compose, porta 3307 para nao conflitar com vendas-ms)
spring.datasource.url=jdbc:mysql://localhost:3307/produtosdb
spring.datasource.username=root
spring.datasource.password=root

# JPA: schema gerenciado exclusivamente via Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Necessario para que o Thymeleaf processe forms com method="put"/"delete" via _method
spring.mvc.hiddenmethod.filter.enabled=true

spring.security.oauth2.client.registration.github.client-id=${OUATH_PRODUTOS_MS_CLIENT_ID_GIT}
spring.security.oauth2.client.registration.github.client-secret=${OUATH_PRODUTOS_MS_SECRET_ID_GIT}
spring.security.oauth2.client.registration.github.scope[0]=public_repo

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

#  Actuator
# Expose all endpoints (health, info, prometheus, metrics, etc.)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
# Tag all metrics with the application name for easier filtering in Grafana
management.metrics.tags.application=${spring.application.name}

#  Zipkin (distributed tracing)
# Send 100% of traces to Zipkin (reduce to e.g. 0.1 in production)
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

#  ActiveMQ (mesmo broker do vendas-ms - subido pelo compose do vendas-ms)
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin

#  Spring Boot Admin Client
spring.boot.admin.client.url=http://localhost:8081
# Base URL que o Admin server (rodando dentro do Docker) usa para alcancar este servico.
# Precisa usar host.docker.internal para o Docker resolver o endereco da maquina host.
spring.boot.admin.client.instance.service-base-url=http://host.docker.internal:8082
