<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.produtos}">Produtos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
<div class="max-w-4xl mx-auto p-4">

    <div th:replace="~{fragments.html :: navbar('produtos')}"></div>

    <div class="bg-white p-4 mt-4 shadow-md rounded-md">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold text-gray-800" th:text="#{produto.list.title}">Catalogo de produtos</h1>
            <a th:href="@{/produtos/novo}" class="px-4 py-2 bg-gray-800 text-white rounded"
               th:text="#{produto.list.new}">Novo produto</a>
        </div>

        <table class="w-full bg-white shadow-md rounded-md">
            <thead>
            <tr class="bg-gray-200">
                <th class="py-2" th:text="#{produto.table.header.codigo}">Codigo</th>
                <th class="py-2" th:text="#{produto.table.header.nome}">Nome</th>
                <th class="py-2" th:text="#{produto.table.header.categoria}">Categoria</th>
                <th class="py-2" th:text="#{produto.table.header.preco}">Preco</th>
                <th class="py-2"></th>
            </tr>
            </thead>

            <tbody>
            <tr th:if="${#lists.isEmpty(produtos)}">
                <td colspan="5" class="py-2 text-center text-gray-500" th:text="#{produto.table.empty}">Nenhum produto cadastrado</td>
            </tr>
            <tr th:each="produto : ${produtos}" th:unless="${#lists.isEmpty(produtos)}" class="border-t">
                <td class="py-2 text-center">
                    <a th:href="@{'/produtos/detalhe/' + ${produto.codigo}}" th:text="${produto.codigo}"
                       class="text-blue-600 hover:underline"></a>
                </td>
                <td class="py-2 text-center" th:text="${produto.nome}"></td>
                <td class="py-2 text-center" th:text="${produto.categoria}"></td>
                <td class="py-2 text-center" th:text="${produto.preco}"></td>
                <td class="py-2 text-center">
                    <form th:action="@{'/produtos/delete/' + ${produto.codigo}}" method="post"
                          th:attr="onsubmit=|return confirm('#{produto.confirm.delete}');|">
                        <button type="submit" class="px-2 py-1 bg-red-500 text-white rounded text-sm"
                                th:text="#{produto.action.delete}">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
